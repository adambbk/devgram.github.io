<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votre commande — DEVGRAM</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6edf5;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #060913 55%, #02040a 100%); }
    .card { width: 100%; max-width: 520px; background: rgba(12, 18, 32, .85); border: 1px solid rgba(148, 163, 184, .2); border-radius: 22px; padding: 28px; }
    h1 { margin: 0 0 6px; font-size: 24px; } p { color: #b8c4d0; line-height: 1.55; }
    ol { list-style: none; padding: 0; margin: 22px 0; display: grid; gap: 12px; }
    li { display: flex; align-items: center; gap: 12px; color: #7d8aa0; font-weight: 600; }
    li .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #1e293b; font-size: 13px; flex: none; }
    li.done { color: #e6edf5; } li.done .dot { background: #10b981; color: #04130d; }
    li.now { color: #fff; } li.now .dot { background: #1e293b; box-shadow: 0 0 0 3px rgba(16, 185, 129, .5); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); } }
    .btn { display: none; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 14px; background: #10b981; color: #04130d; font-weight: 800; text-decoration: none; width: 100%; }
    .btn.show { display: flex; } small { display: block; margin-top: 14px; color: #7d8aa0; }
    @media (prefers-reduced-motion: reduce) { li.now .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Paiement reçu ✅</h1>
    <p id="msg">Nous préparons votre espace…</p>
    <ol>
      <li id="s1"><span class="dot">1</span>Paiement confirmé</li>
      <li id="s2"><span class="dot">2</span>Création de votre espace</li>
      <li id="s3"><span class="dot">3</span>Vérification finale par notre équipe</li>
      <li id="s4"><span class="dot">4</span>Livraison et droits d'administrateur</li>
    </ol>
    <a id="go" class="btn" href="#" target="_blank" rel="noopener">Ouvrir sur Telegram</a>
    <small id="ref"></small>
  </main>
  <script>
    // ⚠️ Remplace par l'adresse publique de ton backend (la même que dans devgram.html)
    const API_BASE = 'http://localhost:3000';
    const id = new URLSearchParams(location.search).get('order');
    const $ = (x) => document.getElementById(x);
    const STAGE = { awaiting_payment: 1, creating: 2, review: 3, ready: 5 };

    function paint(s) {
      const n = STAGE[s.status] || 1;
      [1, 2, 3, 4].forEach((k) => { $('s' + k).className = k < n ? 'done' : (k === n ? 'now' : ''); });
      $('ref').textContent = s.ref ? 'Référence : ' + s.ref : '';
      if (s.status === 'awaiting_payment') { $('title').textContent = 'Paiement en cours de confirmation…'; $('msg').textContent = 'Cela prend généralement quelques secondes.'; }
      if (s.status === 'creating') { $('title').textContent = 'Paiement reçu ✅'; $('msg').textContent = 'Votre espace « ' + s.name + ' » est en cours de création.'; }
      if (s.status === 'review') { $('title').textContent = 'Dernière vérification…'; $('msg').textContent = 'Votre espace est créé. Nous le contrôlons avant de vous le remettre. Vous recevrez aussi un e-mail.'; }
      if (s.status === 'ready') {
        $('title').textContent = 'Votre espace est prêt 🎉';
        $('msg').textContent = 'Rejoignez-le avec le compte ' + s.telegram + ' : vous recevrez les droits d\u2019administrateur automatiquement.';
        $('go').href = s.link; $('go').classList.add('show'); return true;
      }
    }
    async function poll() {
      try {
        const r = await fetch(API_BASE + '/api/order/' + encodeURIComponent(id) + '/status');
        if (r.status === 404) { $('title').textContent = 'Commande introuvable'; $('msg').textContent = 'Le lien est incorrect ou a expiré.'; return; }
        if (paint(await r.json())) return;
      } catch { /* on réessaie */ }
      setTimeout(poll, 4000);
    }
    if (id) poll(); else { $('title').textContent = 'Commande introuvable'; $('msg').textContent = 'Il manque l\u2019identifiant de commande dans le lien.'; }
  </script>
</body>
</html>
